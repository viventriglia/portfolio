name: Update portfolio content

on:
  push:
    branches:
      - main
  schedule:
    # Every day at 03:19 in Italy (following DST)
    - cron: "19 3 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

concurrency:
  group: portfolio-content-and-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TZ: Europe/Rome

jobs:
  update-metrics:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect public metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_metrics.py

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json index.html
          if git diff --cached --quiet; then
            echo "Metrics are already current."
          else
            git commit -m "chore: update portfolio metrics"
            git push origin HEAD:main
          fi

  update-events:
    if: ${{ always() && github.event_name != 'push' }}
    needs: update-metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update event status
        run: python scripts/update_events.py --today "$(TZ=Europe/Rome date +%F)"

      - name: Commit updated event status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Event status is already current."
          else
            git commit -m "chore: update portfolio events"
            git push origin HEAD:main
          fi

  publish:
    if: ${{ !cancelled() }}
    needs:
      - update-metrics
      - update-events
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
